<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0f1a;
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="36.76"
      data-width="1080"
      data-height="1920"
    >
      <!-- scenes, back to back on one lane; timings follow the music (120 bpm, roof drop at 18.26 s) -->
      <div id="teaser" data-composition-id="teaser" data-composition-src="compositions/teaser.html"
        data-start="0" data-duration="2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="site" data-composition-id="site" data-composition-src="compositions/site.html"
        data-start="2" data-duration="4.7636" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="transform" data-composition-id="transform" data-composition-src="compositions/transform.html"
        data-start="6.7636" data-duration="4.7364" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="build" data-composition-id="build" data-composition-src="compositions/build.html"
        data-start="11.5" data-duration="11.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="cuts" data-composition-id="cuts" data-composition-src="compositions/cuts.html"
        data-start="23" data-duration="4.7636" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="price" data-composition-id="price" data-composition-src="compositions/price.html"
        data-start="27.7636" data-duration="5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html"
        data-start="32.7636" data-duration="4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920"></div>

      <audio id="music" class="clip" src="assets/music_rancak.wav" data-start="0" data-duration="36.76"
        data-track-index="3" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
