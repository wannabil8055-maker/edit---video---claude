<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mont;font-weight:500;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2)}

<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920;
const cv=document.getElementById('c'), X=cv.getContext('2d');
let TL=null;
// ---------- utils ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eout=t=>1-Math.pow(1-clamp(t),3);
const ein=t=>Math.pow(clamp(t),3);
const back=t=>{t=clamp(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const seg01=(u,a,b)=>clamp((u-a)/(b-a));
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
const N1=(x)=>Math.sin(x*1.3)*.5+Math.sin(x*2.7+1.3)*.3+Math.sin(x*5.1+2.1)*.2;
const C={navy:'#0B1026',mag:'#FF2E88',cyan:'#22D3EE',gold:'#F5C542',ash:'#6B7280',bone:'#E8E4D9',bruise:'#1E3A8A',ink:'#05060A',red:'#B91C1C',peach:'#F7B79B',teal:'#5EC4B6',wgold:'#E9B949',ivory:'#FFF8EC'};

function grad(c1,c2,y0=0,y1=H){const g=X.createLinearGradient(0,y0,0,y1);g.addColorStop(0,c1);g.addColorStop(1,c2);return g}
function bg(c1,c2){X.fillStyle=grad(c1,c2);X.fillRect(-200,-200,W+400,H+400)}
function rr(x,y,w,h,r){X.beginPath();X.roundRect(x,y,w,h,r)}
function paper(on=true,dy=10,blur=22,col='rgba(0,0,0,.35)'){if(on){X.shadowColor=col;X.shadowBlur=blur;X.shadowOffsetY=dy}else{X.shadowColor='transparent';X.shadowBlur=0;X.shadowOffsetY=0}}
function circ(x,y,r,f){X.beginPath();X.arc(x,y,r,0,Math.PI*2);X.fillStyle=f;X.fill()}
function glow(x,y,r,col,a=1){const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');X.globalAlpha*=a;X.fillStyle=g;X.fillRect(x-r,y-r,2*r,2*r);X.globalAlpha/=a||1}
function txt(s,x,y,size,col,o={}){
  X.save();X.translate(x,y);const sc=o.scale??1;X.scale(sc,sc);if(o.rot)X.rotate(o.rot);
  X.globalAlpha*=o.alpha??1;
  X.font=`${o.weight??800} ${size}px ${o.font??'Mont, Amiri'}`;X.textAlign=o.align??'center';X.textBaseline='middle';
  if(o.ls) X.letterSpacing=o.ls+'px';
  if(o.glow){X.shadowColor=o.glow;X.shadowBlur=o.gb??30}
  if(o.stroke){X.lineJoin='round';X.lineWidth=o.stroke;X.strokeStyle=o.sc??'#000';X.strokeText(s,0,0)}
  X.fillStyle=col;X.fillText(s,0,0);X.restore();
}
// ---------- characters ----------
// faceless person; y = feet. o: col(body), head, pose: 'stand','sit','kneel','walk','lie'
function person(x,y,s,o={}){
  X.save();X.translate(x,y);X.scale(s*(o.flip?-1:1),s);X.globalAlpha*=o.alpha??1;
  const body=o.col??'#2b2f4a', skin=o.skin??'#c99a78', hair=o.hair??'#1a1410';
  if(o.ghost){X.shadowColor='rgba(220,235,255,.9)';X.shadowBlur=40}else paper(true,8,18);
  const pose=o.pose??'stand', t=o.t??0, sl=o.slump??0;
  X.lineCap='round';X.lineJoin='round';
  // legs
  X.strokeStyle=o.legs??'#1c2033';X.lineWidth=34;
  X.beginPath();
  if(pose==='stand'){X.moveTo(-18,-150);X.lineTo(-22,0);X.moveTo(18,-150);X.lineTo(22,0)}
  else if(pose==='walk'){const a=Math.sin(t*9)*22;X.moveTo(-10,-150);X.lineTo(-10+a,0);X.moveTo(10,-150);X.lineTo(10-a,0)}
  else if(pose==='sit'){X.moveTo(-10,-150);X.lineTo(70,-150);X.lineTo(70,0);X.moveTo(10,-140);X.lineTo(90,-140);X.lineTo(95,0)}
  else if(pose==='kneel'){X.moveTo(-10,-120);X.lineTo(50,-40);X.lineTo(-30,-5);X.moveTo(10,-120);X.lineTo(70,-45);X.lineTo(0,-5)}
  X.stroke();
  const ty= pose==='kneel'?-120:pose==='sit'?-150:-150;
  X.translate(0,ty);X.rotate(sl*0.25);
  // torso
  X.fillStyle=body;rr(-48,-170,96,180,38);X.fill();
  // arms
  X.strokeStyle=body;X.lineWidth=28;
  const aL=o.aL??0.15, aR=o.aR??-0.15;
  const arm=(sx,ang,len=130,el=o.elbow??0)=>{X.beginPath();X.moveTo(sx,-150);const ex=sx+Math.sin(ang)*len*.55,ey=-150+Math.cos(ang)*len*.55;X.lineTo(ex,ey);X.lineTo(ex+Math.sin(ang+el)*len*.5,ey+Math.cos(ang+el)*len*.5);X.stroke();X.fillStyle=skin;X.beginPath();X.arc(ex+Math.sin(ang+el)*len*.5,ey+Math.cos(ang+el)*len*.5,14,0,7);X.fill()};
  arm(-46,aL,130,o.elL??0);arm(46,aR,130,o.elR??0);
  // head
  X.fillStyle=skin;X.beginPath();X.ellipse(0,-225,46,52,0,0,7);X.fill();
  if(!o.nohair){X.fillStyle=hair;X.beginPath();X.ellipse(0,-248,48,34,0,Math.PI,Math.PI*2);X.fill()}
  if(o.cap){X.fillStyle=o.cap;X.beginPath();X.ellipse(0,-262,44,22,0,Math.PI,Math.PI*2);X.fill()}
  X.restore();
}
function chest(x,y,s,pose='stand'){const ty=pose==='kneel'?-120:pose==='sit'?-150:-150;return [x,y+(ty-110)*s]}
function kid(x,y,s,o={}){person(x,y,s*0.62,{col:o.col??'#3b82f6',legs:'#1e3a8a',...o})}
function wife(x,y,s,a=1,t=0){ // glowing silhouette outline
  X.save();X.translate(x,y);X.scale(s,s);X.globalAlpha*=a;
  X.shadowColor='rgba(255,220,170,.95)';X.shadowBlur=35;
  X.strokeStyle='rgba(255,230,190,.95)';X.lineWidth=6;X.fillStyle='rgba(255,220,180,.12)';
  X.beginPath();X.moveTo(0,-330);X.bezierCurveTo(48,-330,60,-280,52,-245);X.bezierCurveTo(90,-210,95,-120,105,0);X.lineTo(-105,0);X.bezierCurveTo(-95,-120,-90,-210,-52,-245);X.bezierCurveTo(-60,-280,-48,-330,0,-330);X.closePath();X.fill();X.stroke();
  X.restore();
}
function kafan(x,y,s,a=1,ang=0){ // wrapped body, horizontal
  X.save();X.translate(x,y);X.rotate(ang);X.scale(s,s);X.globalAlpha*=a;paper(true,6,16,'rgba(0,0,0,.5)');
  X.fillStyle='#EFEBE1';rr(-200,-48,400,96,48);X.fill();paper(false);
  X.strokeStyle='rgba(120,110,95,.5)';X.lineWidth=4;
  for(const k of [-130,0,130]){X.beginPath();X.moveTo(k,-46);X.lineTo(k,46);X.stroke()}
  X.beginPath();X.ellipse(-160,0,34,40,0,0,7);X.stroke();
  X.restore();
}
function thread(x,y,len,fray,t,a=1,snapP=-1){ // golden deed thread from chest upward
  X.save();X.globalAlpha*=a;X.lineCap='round';
  X.shadowColor='rgba(245,197,66,.9)';X.shadowBlur=20;
  const pts=k=>{const yy=y-len*k;return [x+Math.sin(k*6+t*2)*18*k+N1(k*3+t)*10*k,yy]};
  const n=40, cut=snapP>=0?0.35:1;
  for(let st=0;st<3;st++){
    X.strokeStyle=st===0?'#FFE08A':'rgba(245,197,66,.8)';X.lineWidth=st===0?5:2.5;
    X.beginPath();
    for(let i=0;i<=n;i++){const k=i/n;if(snapP>=0&&k>cut)break;let [px,py]=pts(k);px+=(st-1)*4*Math.sin(k*20+st);if(i===0)X.moveTo(px,py);else X.lineTo(px,py)}
    X.stroke();
  }
  // frays
  for(let f=0;f<fray;f++){const k=0.15+0.8*rnd(f+3);if(snapP>=0&&k>cut)continue;const [px,py]=pts(k);X.strokeStyle='rgba(245,197,66,.7)';X.lineWidth=2;X.beginPath();X.moveTo(px,py);X.quadraticCurveTo(px+30*(rnd(f)-.5)*2,py+20,px+50*(rnd(f+9)-.5)*2,py+40+20*rnd(f));X.stroke()}
  if(snapP>=0){ // floating broken end
    const [px,py]=pts(cut);const fl=snapP;
    X.globalAlpha*=clamp(1-fl);X.strokeStyle='#FFE08A';X.lineWidth=4;X.beginPath();
    for(let i=0;i<=20;i++){const k=cut+0.05+i/20*0.6;let [qx,qy]=pts(k);qy-=fl*300;qx+=Math.sin(i+fl*4)*fl*40;if(i===0)X.moveTo(qx,qy);else X.lineTo(qx,qy)}X.stroke();
    glow(px,py-fl*300,40,'rgba(255,220,120,1)',clamp(1-fl));
  }
  X.restore();
}
function phone(x,y,w,h,rot,screen){X.save();X.translate(x,y);X.rotate(rot||0);paper(true,8,20);X.fillStyle='#111';rr(-w/2,-h/2,w,h,w*.16);X.fill();paper(false);X.save();rr(-w/2+8,-h/2+8,w-16,h-16,w*.13);X.clip();if(screen)screen(w-16,h-16);X.restore();X.restore()}
// ---------- particles ----------
function dust(cx,cy,u,n=30,spread=420,col='rgba(230,220,200,'){for(let i=0;i<n;i++){const a=rnd(i)*Math.PI;const sp=(0.4+rnd(i+5))*spread;const px=cx+Math.cos(a)*sp*eout(u)*(rnd(i+1)>.5?1:-1);const py=cy-Math.sin(a)*sp*.35*eout(u);const r=(20+rnd(i+7)*40)*(1+u);X.globalAlpha=clamp(1-u)*.6;circ(px,py,r,col+'1)')}X.globalAlpha=1}
function glitter(t,n=60,col=C.gold){for(let i=0;i<n;i++){const px=rnd(i)*W,py=(rnd(i+50)*H+t*60*(0.3+rnd(i+9)))%H;const tw=.5+.5*Math.sin(t*6+i);X.globalAlpha=tw*.8;circ(px,py,2+3*rnd(i+3),col)}X.globalAlpha=1}
function motes(t,n=40,col='rgba(255,255,255,1)',a=.25){for(let i=0;i<n;i++){const px=(rnd(i)*W+Math.sin(t*.3+i)*40),py=(rnd(i+20)*H-t*20*(0.3+rnd(i)))%H;X.globalAlpha=a*(.5+.5*Math.sin(t+i));circ(px,(py+H)%H,2+3*rnd(i+4),col)}X.globalAlpha=1}
// ---------- camera shake from impacts ----------
let IMP=[];
function shake(t){let a=0;for(const [t0,s,d] of IMP){if(t>=t0&&t<t0+d)a+=s*(1-(t-t0)/d)}return [a*Math.sin(t*93),a*Math.cos(t*71)]}

// ================== SCENES ==================
const S={};
// ---- room used in hook pullback & s1
function room(t,u){
  bg('#0e1433','#070a1c');
  // window with neon city
  X.save();paper(true);X.fillStyle='#141b45';rr(560,260,420,520,20);X.fill();paper(false);
  X.save();rr(580,280,380,480,12);X.clip();bg('#1a1f5a','#2a0f3d');
  for(let i=0;i<9;i++){const bx=580+i*44,bh=120+rnd(i)*260;X.fillStyle=i%2?'#1b1340':'#24174f';X.fillRect(bx,760-bh,40,bh);for(let j=0;j<8;j++)if(rnd(i*9+j)>.45){X.fillStyle=rnd(i+j)>.5?C.mag:C.cyan;X.globalAlpha=.5+.4*Math.sin(t*2+i+j);X.fillRect(bx+8+(j%2)*16,760-bh+16+Math.floor(j/2)*28,9,12);X.globalAlpha=1}}
  X.restore();X.strokeStyle='#0b0f2e';X.lineWidth=12;X.beginPath();X.moveTo(770,280);X.lineTo(770,760);X.stroke();X.restore();
  // wall clock
  X.save();paper(true);circ(240,420,90,'#e8e4d9');paper(false);X.strokeStyle='#222';X.lineWidth=8;X.lineCap='round';
  const ha=-Math.PI/2+t*0.05+2.6, ma=-Math.PI/2+t*0.8;X.beginPath();X.moveTo(240,420);X.lineTo(240+Math.cos(ha)*45,420+Math.sin(ha)*45);X.moveTo(240,420);X.lineTo(240+Math.cos(ma)*70,420+Math.sin(ma)*70);X.stroke();
  txt('ISHA',240,545,30,'rgba(232,228,217,.6)',{weight:800});X.restore();
  // floor & bed
  X.fillStyle='#0a0d24';X.fillRect(0,1250,W,700);
  X.save();paper(true);X.fillStyle='#2a2f63';rr(330,1080,700,190,30);X.fill();X.fillStyle='#e7e2f5';rr(860,1040,150,70,30);X.fill();paper(false);X.restore();
  // rolled prayer mat corner with spotlight & dust
  glow(150,1220,260,'rgba(255,230,160,.18)');
  X.save();paper(true);X.translate(150,1235);X.fillStyle='#7a2b2b';rr(-95,-40,190,80,40);X.fill();X.fillStyle='#a33d3d';X.beginPath();X.ellipse(95,0,26,40,0,0,7);X.fill();X.strokeStyle='#e9b949';X.lineWidth=4;X.beginPath();X.ellipse(95,0,14,24,0,0,7);X.stroke();paper(false);
  X.fillStyle='rgba(200,200,200,.35)';for(let i=0;i<14;i++)circ(-80+rnd(i)*170,-40+rnd(i+3)*10,3,'rgba(210,210,200,.5)');X.restore();
  for(let i=0;i<14;i++){X.globalAlpha=.4;circ(90+rnd(i)*120,1050+((rnd(i+2)*180+t*15)%180),2.5,'#fff')}X.globalAlpha=1;
  // man sitting on bed with phone
  const mx=560,my=1250;
  glow(mx-60,my-420,280,'rgba(120,200,255,.35)');
  person(mx,my,1.15,{pose:'sit',col:'#1f2546',aL:2.3,aR:2.5,elL:0.9,elR:0.7,t,slump:0.15+0.03*Math.sin(t*3)});
  // phone in hands
  phone(mx-20,my-445,70,120,-0.2,(w,h)=>{X.fillStyle='#bfefff';X.fillRect(-w/2,-h/2,w,h);for(let i=0;i<5;i++){X.fillStyle=[C.mag,C.cyan,C.gold,'#fff','#a78bfa'][i];X.fillRect(-w/2+6,((i*30-t*240)%150)-h/2,w-12,22)}});
  // earbuds music notes cage
  for(let i=0;i<7;i++){const a=t*1.6+i*0.9;const r=150+20*Math.sin(t*3+i);const nx=mx+Math.cos(a)*r,ny=my-430-110+Math.sin(a)*r*.45;X.globalAlpha=.85;txt(i%2?'♪':'♫',nx,ny,54,i%3?C.cyan:C.mag,{glow:i%3?C.cyan:C.mag,weight:500,font:'DejaVu Sans, sans-serif'})}X.globalAlpha=1;
}
S.hook=(u,d,t)=>{
  if(u<0.8){ // fake feed
    bg('#0b0b10','#14141c');
    for(let i=0;i<6;i++){const y=((i*700-u*2600)%(700*6)+700*6)%(700*6)-400;
      X.save();X.translate(W/2,y);paper(true);X.fillStyle=['#2d1b69','#5b2a86','#13315c','#3c1053','#1b4332','#5e1742'][i];rr(-470,-300,940,620,40);X.fill();paper(false);
      if(i%2===0){circ(-60,40,150,'#f59e0b');circ(-150,-90,50,'#f59e0b');circ(30,-90,50,'#f59e0b');circ(-110,20,14,'#111');circ(-10,20,14,'#111')}
      else{X.fillStyle=C.mag;rr(-300,40,600,110,50);X.fill();circ(-180,160,50,'#111');circ(180,160,50,'#111')}
      X.restore()}
    for(let i=0;i<10;i++){const hy=H-((u*1500+i*170)%1600);txt('♥',900+Math.sin(i+u*8)*40,hy,60+i*3,i%2?C.mag:'#ff6b6b',{weight:500,font:'DejaVu Sans'})}
    // thumb
    const ty=1450-((u*3)%1)*500;X.save();paper(true);X.fillStyle='#d6a585';rr(560,ty,170,330,85);X.fill();X.fillStyle='#e9c3a8';rr(590,ty+20,110,120,50);X.fill();X.restore();
    // UI chrome
    txt('For You',W/2,120,44,'#fff',{weight:800});
    return;
  }
  bg('#000','#04040a');
  if(u<1.3){ // heart line + slam text
    X.save();X.strokeStyle='#fff';X.lineWidth=6;X.shadowColor='#fff';X.shadowBlur=20;X.beginPath();
    const prog=seg01(u,0.8,1.3);
    for(let i=0;i<=200;i++){const k=i/200;if(k>prog*1.3)break;const xx=k*W;let yy=1150;const bl=(c)=>Math.exp(-Math.pow((k-c)*60,2));yy-= (bl(0.2)*180-bl(0.23)*90+bl(0.5)*170-bl(0.53)*80);if(i===0)X.moveTo(xx,yy);else X.lineTo(xx,yy)}X.stroke();X.restore();
  }
  const words=['YOU HAVE','3','SECONDS.'];
  if(u<1.3){words.forEach((w,i)=>{const t0=0.85+i*0.14;if(u>t0){const k=eout((u-t0)/0.12);txt(w,W/2,600+i*170,i===1?260:120,i===1?'#ff3b3b':'#fff',{scale:lerp(1.6,1,k),alpha:k,weight:900,glow:i===1?'#ff0000':null,gb:40})}})}
  if(u>=1.3){
    const cp=eout((u-1.3)/0.5);
    // glow below
    glow(W/2,1300,700*cp,'rgba(37,99,235,.55)');
    // grave hint
    X.globalAlpha=cp*.8;X.fillStyle='#0a0f1e';rr(340,1150,400,600,10);X.fill();X.globalAlpha=1;
    // cracks
    X.save();X.strokeStyle='rgba(220,235,255,.85)';X.lineWidth=4;X.shadowColor='#9cc3ff';X.shadowBlur=10;
    for(let i=0;i<14;i++){let x0=W/2,y0=880,a=i/14*Math.PI*2+rnd(i)*.3;X.beginPath();X.moveTo(x0,y0);const L=(400+rnd(i+2)*700)*cp;for(let k=1;k<=6;k++){a+=(rnd(i*7+k)-.5)*.6;x0+=Math.cos(a)*L/6;y0+=Math.sin(a)*L/6;X.lineTo(x0,y0)}X.stroke()}X.restore();
    // remaining words cracked
    X.globalAlpha=clamp(1-(u-1.3)/0.3);words.forEach((w,i)=>txt(w,W/2+(i-1)*8,600+i*170,i===1?260:120,i===1?'#ff3b3b':'#fff',{weight:900}));X.globalAlpha=1;
    const s2='…to answer 3 questions.';const n=Math.floor(clamp((u-1.45)/0.6)*s2.length);
    const gx=(rnd(Math.floor(u*30))-.5)*14*(u<2.2?1:0);
    txt(s2.slice(0,n),W/2+gx,880,76,'#fff',{weight:900,stroke:10});
    if(u>1.6) txt(s2.slice(0,n),W/2+gx+6,884,76,'rgba(34,211,238,.35)',{weight:900});
  }
  if(u>2.6){ // pull back into room
    const k=ease(seg01(u,2.6,d));
    X.save();X.globalAlpha=k;const z=lerp(5,1,k);X.translate(540,805);X.scale(z,z);X.translate(-540,-805);room(t,0);X.restore();
    X.globalAlpha=clamp((u-2.9)/0.3);txt("Watch till the end. It's about YOU.",W/2,170,42,'#fff',{weight:800,stroke:8});X.globalAlpha=1;
  }
};
S.s1=(u,d,t)=>{room(t,u);X.globalAlpha=clamp(1-u/0.8);txt("Watch till the end. It's about YOU.",W/2,170,42,'#fff',{weight:800,stroke:8});X.globalAlpha=1;
  // adhan faint waves from window
  for(let i=0;i<3;i++){const r=((u*120+i*90)%270);X.strokeStyle=`rgba(233,185,73,${.25*(1-r/270)})`;X.lineWidth=3;X.beginPath();X.arc(770,520,r,0,7);X.stroke()}
};
S.s2=(u,d,t)=>{
  bg('#151033','#0a0820');glitter(t,30,C.mag);
  // giant phone UI
  phone(540,560,620,900,0,(w,h)=>{
    X.fillStyle='#1d1438';X.fillRect(-w/2,-h/2,w,h);
    // swipe card
    const sw=((u*1.4)%1);const sx=sw<.6?0:ease((sw-.6)/.4)*700;
    X.save();X.translate(sx,-80);X.rotate(sx/2000);X.fillStyle='#ffb3d1';rr(-220,-300,440,520,30);X.fill();X.fillStyle='#ff7fb0';X.beginPath();X.ellipse(0,-90,95,110,0,0,7);X.fill();X.fillStyle='#ffd6e7';rr(-140,40,280,40,20);X.fill();X.restore();
