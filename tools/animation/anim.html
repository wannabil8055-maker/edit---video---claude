<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- palette ----------
const NAVY = '#0B1A2F', TEAL = '#12343B', INDIGO = '#2A2550', GOLD = '#F2C14E',
      IVORY = '#F7F1E3', ROSE = '#D9A5A0';

// ---------- timeline (matches the voice track) ----------
const S = { hook: 8/30, s2: 3.0, s3: 5.4, s4: 7.9, s5: 9.6, s6: 14.5, s7: 17.6, s8: 20.6, s9: 23.5,
  s10: 24.9, s11: 27.0, s12: 30.4, s13: 34.0, s14: 34.9, s15: 38.8, freeze: 43.4, cta: 44.2, end: 53.2 };
const LEN = { hook: 82/30, s2: 2.4, s3: 2.5, s4: 1.7, s5: 4.9, s6: 3.1, s7: 3.0, s8: 2.9, s9: 1.4, s10: 2.1,
  s11: 3.4, s12: 3.6, s13: 0.9, s14: 3.9, s15: 4.6 };

// ---------- utils ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const ease = x => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 3);
function backOut(x) { x = clamp(x); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
const pop = (lt, d = 0.24) => lt < 0 ? 0 : lerp(0.55, 1, backOut(lt / d));
const fadeIO = (lt, dur, fi = 0.25, fo = 0.25) => clamp(lt / fi) * clamp((dur - lt) / fo);
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(c1, c2, x) { const a = hex(c1), b = hex(c2); return `rgb(${a.map((v, i) => Math.round(lerp(v, b[i], clamp(x)))).join(',')})`; }
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function bez(p0, p1, p2, p3, u) { const v = 1 - u;
  return [v*v*v*p0[0] + 3*v*v*u*p1[0] + 3*v*u*u*p2[0] + u*u*u*p3[0], v*v*v*p0[1] + 3*v*v*u*p1[1] + 3*v*u*u*p2[1] + u*u*u*p3[1]]; }

function txt(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= (o.alpha ?? 1);
  ctx.translate(x, y);
  if (o.scale !== undefined) ctx.scale(o.scale, o.scale);
  if (o.rot) ctx.rotate(o.rot);
  ctx.font = o.font || '900 80px "Inter Display"';
  ctx.textAlign = o.align || 'center';
  ctx.textBaseline = 'middle';
  if (o.ls) ctx.letterSpacing = o.ls + 'px';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.glowBlur || 40; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.lw || 10; ctx.strokeStyle = o.stroke; ctx.strokeText(s, 0, 0); }
  ctx.shadowBlur = o.glow ? (o.glowBlur || 40) : 0;
  ctx.fillStyle = o.fill || IVORY; ctx.fillText(s, 0, 0);
  ctx.restore();
}
function glowDot(x, y, r, color, a = 1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(color, a)); g.addColorStop(0.35, rgba(color, a * 0.35)); g.addColorStop(1, rgba(color, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}

// ---------- precomputed assets ----------
const R0 = rng(11);
const STARS = Array.from({ length: 260 }, () => ({ x: R0() * W, y: R0() * H * 0.75, r: 0.6 + R0() * 2.2, p: R0() * 6.28, s: 0.5 + R0() * 2 }));
const grain = document.createElement('canvas'); grain.width = 540; grain.height = 960;
{ const g = grain.getContext('2d'); const im = g.createImageData(540, 960); const R = rng(5);
  for (let i = 0; i < im.data.length; i += 4) { const v = 110 + R() * 70; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0); }

// city + kampung layers
const RC = rng(21);
const CITY = []; { let x = -40; while (x < W + 40) { const w = 70 + RC() * 90, h = 260 + RC() * 420; const wins = [];
  for (let wy = 30; wy < h - 30; wy += 46) for (let wx = 14; wx < w - 24; wx += 30) if (RC() < 0.75) wins.push([wx, wy, RC()]);
  CITY.push({ x, w, h, wins }); x += w + 6 + RC() * 14; } }
const KAMPUNG = []; { let x = -30; let i = 0; while (x < W + 60) { const w = 130 + RC() * 70, h = 90 + RC() * 40;
  KAMPUNG.push({ x, w, h, roof: 70 + RC() * 30, stilt: 34 + RC() * 20, palm: RC() < 0.5, i: i++, lr: RC() });
  x += w + 40 + RC() * 60; } }
const CITY_BASE = 1500, KAMP_BASE = 1700;

// windows that send threads (city + kampung), sorted by time
const THREADS = []; { const R = rng(33); const pick = [];
  CITY.forEach((b, bi) => b.wins.forEach((w, wi) => { if (w[2] > 0.93) pick.push({ x: b.x + w[0] + 9, y: CITY_BASE - b.h + w[1] + 13, k: 'c' }); }));
  KAMPUNG.forEach(k => pick.push({ x: k.x + k.w * 0.35, y: KAMP_BASE - k.stilt - k.h * 0.55, k: 'k' }));
  pick.sort(() => R() - 0.5);
  pick.slice(0, 16).forEach((p, i) => THREADS.push({ ...p, t0: i * 0.26 + R() * 0.15, wob: R() * 6 })); }
// viewer's window for the CTA (kampung house closest to centre)
const VIEW = (() => { let best = null; KAMPUNG.forEach(k => { const cx = k.x + k.w * 0.35; if (!best || Math.abs(cx - 560) < Math.abs(best.x - 560)) best = { x: cx, y: KAMP_BASE - k.stilt - k.h * 0.55 }; }); return best; })();

// shatter shards for the pending card
const SHARDS = (() => { const R = rng(44), a = []; for (let i = 0; i < 30; i++) {
  const x = 190 + R() * 700, y = 700 + R() * 240; a.push({ x, y, vx: (x - 540) * (1.2 + R()), vy: -200 - R() * 500, r: 18 + R() * 40, rot: R() * 6, vr: (R() - .5) * 10 }); } return a; })();

// hook clock sample points for the shatter
const CLOCKPTS = (() => { const R = rng(55), a = [];
  for (let i = 0; i < 180; i++) { const an = R() * 6.283; a.push({ x: 540 + Math.cos(an) * 230, y: 860 + Math.sin(an) * 230 }); }
  for (let i = 0; i < 60; i++) { const u = R(); a.push({ x: 540 + Math.cos(-Math.PI / 2 + 240 / 360 * 6.283) * 190 * u, y: 860 + Math.sin(-Math.PI / 2 + 240 / 360 * 6.283) * 190 * u }); }
  for (let i = 0; i < 120; i++) a.push({ x: 380 + R() * 320, y: 1150 + R() * 100 });
  return a.map(p => ({ ...p, vx: (R() - .5) * 260, vy: -(500 + R() * 900), d: R() * 0.15, s: 1.5 + R() * 3 })); })();

// ---------- captions (karaoke) ----------
const CAPS = [];
function cap(seg, chunks, eng) {
  const a = S[seg] + 0.05, b = S[seg] + LEN[seg] - 0.05;
  const total = chunks.reduce((s, c) => s + c.length, 0); let t0 = a;
  chunks.forEach(c => { const d = (b - a) * c.length / total; const words = c.split(' '); const wl = words.reduce((s, w) => s + w.length, 0);
    let tw = t0; const ws = words.map(w => { const o = { w, ta: tw }; tw += d * w.length / wl * 0.85; return o; });
    CAPS.push({ a: t0, b: t0 + d, ws }); t0 += d; });
  if (eng) CAPS.push({ a, b, eng });
}
cap('hook', ['8:40 juga', 'mak dengan ayah', 'terima pahala itu'], 'It reaches their grave — that same second.');
cap('s2', ['Amalan-amalan', 'ibadah'], 'The worship and good deeds…');
cap('s3', ['dan kebaikan', 'daripada anak…'], '…that come from a child');
cap('s4', ['Kalau anak itu', 'sebut pukul 8:40…'], 'If the child says it at 8:40…');
cap('s5', ['8:40 juga', 'mak dengan ayah', 'terima pahala itu'], '…at 8:40 the parents receive that reward');
cap('s6', ['Takdak', 'pending-pending,', 'takdak.'], 'No “pending”. None.');
cap('s7', ['Transaksi ibadah', 'yang dilakukan'], 'Every act of worship done…');
cap('s8', ['oleh anak', 'dan cucu…'], '…by children and grandchildren…');
cap('s10', ['Seorang anak soleh', 'kalau dia kata…'], 'If a righteous child says…');
cap('s12', ['Pukul 9 pagi,', '9 pagi lah sampai', 'dekat ayah dengan mak', 'dalam kubur.'], 'At 9am, it reaches his parents in the grave');
cap('s15', ['Tapi berapa ramai', 'yang boleh sebut', '5 kali, 10 kali', 'kepada mak ayah dia?', '…Tak ramai.'], 'But how many say it 5, 10 times for their parents?');

function drawCaptions(t) {
  for (const c of CAPS) {
    if (t < c.a || t >= c.b) continue;
    const lt = t - c.a;
    if (c.eng) { txt(c.eng, W / 2, 1548, { font: '500 42px Inter', fill: IVORY, alpha: 0.9 * clamp(lt / 0.15), stroke: 'rgba(0,0,0,0.75)', lw: 7 }); continue; }
    ctx.save(); ctx.font = '800 84px Inter'; const sp = ctx.measureText(' ').width;
    const widths = c.ws.map(w => ctx.measureText(w.w).width); const tot = widths.reduce((a, b) => a + b, 0) + sp * (c.ws.length - 1);
    let x = W / 2 - tot / 2; const a = clamp(lt / 0.06); const yy = 1470 + (1 - easeOut(lt / 0.12)) * 14;
    c.ws.forEach((w, i) => { txt(w.w, x + widths[i] / 2, yy, { font: '800 84px Inter', fill: t >= w.ta ? GOLD : IVORY, stroke: 'rgba(0,0,0,0.85)', lw: 12, alpha: a });
      x += widths[i] + sp; });
    ctx.restore();
  }
}

// ---------- scenery ----------
function sky(top, mid, bot, starA, t, moon) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, top); g.addColorStop(0.55, mid); g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (starA > 0) for (const s of STARS) { const a = starA * (0.45 + 0.55 * Math.sin(t * s.s + s.p)); if (a <= 0.02) continue;
    ctx.fillStyle = `rgba(247,241,227,${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  if (moon) { glowDot(moon.x, moon.y, moon.r * 5, IVORY, 0.22 * (moon.a ?? 1));
    ctx.save(); ctx.globalAlpha = moon.a ?? 1; ctx.fillStyle = '#FBF6E9'; ctx.beginPath(); ctx.arc(moon.x, moon.y, moon.r, 0, 7); ctx.fill();
    ctx.globalCompositeOperation = 'source-atop'; ctx.fillStyle = 'rgba(200,190,170,0.18)';
    [[-.3, -.2, .22], [.25, .1, .16], [-.05, .35, .12]].forEach(([dx, dy, rr]) => { ctx.beginPath(); ctx.arc(moon.x + dx * moon.r, moon.y + dy * moon.r, rr * moon.r, 0, 7); ctx.fill(); });
    ctx.restore(); }
}
function hills(base, amp, color, seed, phase = 0) {
  ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 12) { const y = base - amp * (0.55 * Math.sin(x / 210 + seed) + 0.3 * Math.sin(x / 97 + seed * 2.3 + phase) + 0.15 * Math.sin(x / 41 + seed * 5)); ctx.lineTo(x, y); }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
}
function veil(y, t, a = 1) {
  const g = ctx.createLinearGradient(0, y - 120, 0, y + 120); g.addColorStop(0, 'rgba(247,241,227,0)'); g.addColorStop(0.5, `rgba(247,241,227,${0.2 * a})`); g.addColorStop(1, 'rgba(247,241,227,0)');
  ctx.fillStyle = g; ctx.fillRect(0, y - 120, W, 240);
  for (let i = 0; i < 9; i++) { const x = ((i * 157 + t * (18 + i * 4)) % (W + 400)) - 200; const yy = y + Math.sin(i * 2.1 + t * 0.4) * 30;
    ctx.save(); ctx.globalAlpha = 0.14 * a; ctx.translate(x, yy); ctx.scale(2.6, 0.55); glowDot(0, 0, 120, IVORY, 0.6); ctx.restore(); }
}

function kemboja(x, y, s, t, seed = 3, col = '#06121a', bloomGlow = 0) {
  const R = rng(seed); ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineCap = 'round';
  const tips = [];
  function br(x0, y0, an, len, w, d) {
    const sway = Math.sin(t * 0.8 + d) * 0.02 * (4 - d);
    const x1 = x0 + Math.cos(an + sway) * len, y1 = y0 + Math.sin(an + sway) * len;
    ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo((x0 + x1) / 2 + (R() - .5) * 30, (y0 + y1) / 2 + (R() - .5) * 20, x1, y1); ctx.stroke();
    if (d >= 3) { tips.push([x1, y1, an]); return; }
    const n = 2 + (R() < 0.4 ? 1 : 0);
    for (let i = 0; i < n; i++) br(x1, y1, an + (i - (n - 1) / 2) * 0.7 + (R() - .5) * 0.3, len * (0.62 + R() * 0.15), w * 0.62, d + 1);
  }
  br(0, 0, -Math.PI / 2 + 0.08, 170, 34, 0);
  for (const [tx, ty, an] of tips) {
    for (let i = 0; i < 7; i++) { const a = an + (i - 3) * 0.42 + Math.sin(t + i) * 0.03; ctx.save(); ctx.translate(tx, ty); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(34, 0, 36, 10, 0, 0, 7); ctx.fill(); ctx.restore(); }
    for (let i = 0; i < 3; i++) { const bx = tx + (R() - .5) * 40, by = ty - 10 + (R() - .5) * 30; flower(bx, by, 9, bloomGlow); }
  }
  ctx.restore();
}
function flower(x, y, r, glow = 0, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; if (glow) glowDot(x, y, r * 6, GOLD, 0.5 * glow);
  ctx.fillStyle = '#F7F1E3';
  for (let i = 0; i < 5; i++) { const an = i * 1.2566; ctx.beginPath(); ctx.ellipse(x + Math.cos(an) * r * 0.9, y + Math.sin(an) * r * 0.9, r, r * 0.55, an, 0, 7); ctx.fill(); }
  ctx.fillStyle = GOLD; ctx.beginPath(); ctx.arc(x, y, r * 0.45, 0, 7); ctx.fill(); ctx.restore();
}
function grave(x, y, s, glow = 0, col = '#173f49', rim = 'rgba(247,241,227,0.35)') {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (glow > 0) glowDot(0, -30, 230, GOLD, 0.55 * glow);
  ctx.fillStyle = '#0c2630'; ctx.beginPath(); ctx.ellipse(0, 0, 135, 22, 0, 0, 7); ctx.fill();
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-115, 0); ctx.bezierCurveTo(-100, -34, 100, -34, 115, 0); ctx.closePath(); ctx.fill();
  function nisan(nx, h, w) { ctx.beginPath(); ctx.moveTo(nx - w / 2, -14); ctx.lineTo(nx - w / 2, -h * 0.7);
    ctx.quadraticCurveTo(nx - w / 2, -h * 0.85, nx - w * 0.2, -h * 0.9); ctx.quadraticCurveTo(nx, -h * 1.05, nx + w * 0.2, -h * 0.9);
    ctx.quadraticCurveTo(nx + w / 2, -h * 0.85, nx + w / 2, -h * 0.7); ctx.lineTo(nx + w / 2, -14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = glow > 0 ? rgba(GOLD, 0.35 + 0.6 * glow) : rim; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = mix('#1f5360', GOLD, glow * 0.25); nisan(-88, 112, 40); nisan(88, 76, 32);
  ctx.restore();
}
function graveyard(t, o = {}) {
  const top = o.top || NAVY, mid = o.mid || INDIGO, bot = o.bot || TEAL;
  sky(top, mid, bot, o.stars ?? 0.8, t, o.moon === null ? null : (o.moon || { x: 780, y: 520, r: 70 }));
  if (o.sun) { glowDot(o.sun.x, o.sun.y, 520, '#F6C98A', 0.6 * o.sun.a); glowDot(o.sun.x, o.sun.y, 120, '#FFE7B0', o.sun.a); }
  if (o.veil !== undefined) veil(o.veil, t, o.veilA ?? 1);
  hills(1150, 60, mix('#0f2b35', '#4a3a52', o.dawn || 0), 1.3);
  hills(1250, 40, mix('#0b222b', '#3a2c40', o.dawn || 0), 4.1, t * 0.05);
  kemboja(230, 1290, 1.15, t, 3, mix('#05101a', '#2a1c2a', o.dawn || 0), o.treeGlow || 0);
  ctx.fillStyle = mix('#071820', '#24182a', o.dawn || 0); ctx.fillRect(0, 1280, W, H - 1280);
  [[160, 1255, .55], [900, 1250, .6], [760, 1235, .45], [330, 1238, .45]].forEach(([x, y, s]) => grave(x, y, s, 0, '#123540', 'rgba(247,241,227,0.18)'));
  grave(400, 1335, 1.0, o.g1 || 0); grave(690, 1340, 1.0, o.g2 || 0);
  // fireflies
  const R = rng(77); for (let i = 0; i < 26; i++) { const bx = R() * W, by = 1000 + R() * 450, ph = R() * 6;
    const x = bx + Math.sin(t * 0.6 + ph) * 30, y = by + Math.cos(t * 0.5 + ph * 2) * 20; const a = (0.4 + 0.6 * Math.sin(t * 2 + ph)) * (o.ff ?? 1);
    if (a > 0.05) glowDot(x, y, 14, GOLD, 0.6 * a); }
}
function clock(x, y, r, hh, mm, a = 1, o = {}) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
  if (o.glow) glowDot(0, 0, r * 2.2, GOLD, 0.25 * o.glow);
  ctx.fillStyle = o.face || 'rgba(11,26,47,0.55)'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = o.ring || IVORY; ctx.lineWidth = Math.max(2, r * 0.045); ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();
  for (let i = 0; i < 12; i++) { const an = i / 12 * 6.283; const l = i % 3 === 0 ? 0.16 : 0.09;
    ctx.lineWidth = Math.max(1.5, r * (i % 3 === 0 ? 0.035 : 0.02)); ctx.beginPath();
    ctx.moveTo(Math.sin(an) * r * (0.92 - l), -Math.cos(an) * r * (0.92 - l)); ctx.lineTo(Math.sin(an) * r * 0.92, -Math.cos(an) * r * 0.92); ctx.stroke(); }
  const ma = mm / 60 * 6.283, ha = (hh % 12 + mm / 60) / 12 * 6.283;
  ctx.lineCap = 'round'; ctx.strokeStyle = o.hands || GOLD;
  ctx.lineWidth = r * 0.06; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(ha) * r * 0.5, -Math.cos(ha) * r * 0.5); ctx.stroke();
  ctx.lineWidth = r * 0.04; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(ma) * r * 0.78, -Math.cos(ma) * r * 0.78); ctx.stroke();
  ctx.fillStyle = o.hands || GOLD; ctx.beginPath(); ctx.arc(0, 0, r * 0.06, 0, 7); ctx.fill();
  ctx.restore();
}
// kneeling teen silhouette, facing right; raise 0..1
function teen(x, y, s, raise, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const col = o.col || '#050c16';
  // sejadah
  ctx.fillStyle = '#1b4a4f'; ctx.beginPath(); ctx.moveTo(-150, 4); ctx.lineTo(170, 4); ctx.lineTo(150, 18); ctx.lineTo(-175, 18); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba(GOLD, 0.7); ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-14, -228);
  ctx.bezierCurveTo(-40, -205, -62, -160, -66, -115); ctx.bezierCurveTo(-70, -80, -96, -62, -98, -30);
  ctx.bezierCurveTo(-100, -12, -95, -2, -80, 4); ctx.lineTo(80, 4); ctx.bezierCurveTo(96, 0, 95, -32, 76, -44);
  ctx.bezierCurveTo(50, -56, 18, -60, 6, -64); ctx.bezierCurveTo(22, -95, 32, -140, 28, -175);
  ctx.bezierCurveTo(26, -200, 18, -215, 10, -224); ctx.closePath(); ctx.fill();
  // head + kopiah
  ctx.beginPath(); ctx.arc(-2, -262, 36, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-36, -276); ctx.lineTo(32, -276); ctx.lineTo(30, -300); ctx.quadraticCurveTo(-2, -306, -34, -300); ctx.closePath(); ctx.fill();
  // arms
  const el = [lerp(22, 40, raise), lerp(-128, -140, raise)], hd = [lerp(64, 84, raise), lerp(-70, -206, raise)];
  ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 25;
  ctx.beginPath(); ctx.moveTo(-6, -198); ctx.lineTo(el[0], el[1]); ctx.lineTo(hd[0], hd[1]); ctx.stroke();
  ctx.save(); ctx.translate(hd[0], hd[1]); ctx.rotate(lerp(0.2, -0.5, raise)); ctx.beginPath(); ctx.ellipse(4, -4, 15, 22, 0, 0, 7); ctx.fill(); ctx.restore();
  // rim light (light from the right)
  if (o.rim !== 0) { ctx.strokeStyle = rgba(o.rimCol || GOLD, o.rim ?? 0.55); ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-2, -262, 37, -1.3, 0.9); ctx.stroke();
